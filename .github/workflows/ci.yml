name: CI

# Check the registry against crates/, test every crate, and run each crate's
# examples against hql built from a given ref.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hql_ref:
        description: The hql branch, tag or commit to build
        default: main

env:
  CARGO_TERM_COLOR: always
  HQL_REF: ${{ inputs.hql_ref || 'main' }}

jobs:
  registry:
    name: Registry matches crates/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every crate is registered and every official entry is a crate
        run: |
          listed=$(python3 -c '
          import re, sys
          text = open("hql-packages.yaml").read()
          crates = re.findall(r"^\s+crate:\s*(\S+)\s*$", text, re.M)
          kinds = re.findall(r"^\s+kind:\s*(\S+)\s*$", text, re.M)
          print("\n".join(c for c, k in zip(crates, kinds) if k == "official"))
          ' | sort)
          present=$(ls crates | sort)
          if [ "$listed" != "$present" ]; then
            echo "registry lists:"; echo "$listed"
            echo "crates/ holds:"; echo "$present"
            exit 1
          fi

  examples:
    name: Test the crates and run their examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hql is built from source at the ref: a package compiles against the
      # checkout its `hql` binary was built from, with the compiler it pins.
      - name: Check out hql
        run: git clone --depth 1 --branch "$HQL_REF" https://github.com/ewiger/hql "$RUNNER_TEMP/hql-src"
      - name: Install the toolchain hql pins
        working-directory: ${{ runner.temp }}/hql-src
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build hql
        working-directory: ${{ runner.temp }}/hql-src
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/hql"
          echo "$RUNNER_TEMP/hql/bin" >> "$GITHUB_PATH"
      - name: Test the crates
        run: cargo test --workspace --config "patch.crates-io.hql.path=\"$RUNNER_TEMP/hql-src\""
      - name: Run the examples
        run: sh scripts/check-examples.sh
