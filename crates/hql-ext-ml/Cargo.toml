[package]
name = "hql-ext-ml"
version = "0.1.0"
description = "HQL package `ml`: datasets, fitted models as values, prediction and metrics"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `hql = "0.7"` once hql publishes `hql::ext` (HQL-0057 part 1).

[package.metadata.hql]
package = "ml"
provides = ["ml", "ml.metrics"]
modules = "modules"
