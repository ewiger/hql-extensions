[package]
name = "hql-ext-ml"
version = "0.1.0"
description = "HQL package `ml`: datasets, fitted models as values, prediction and metrics"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
linfa = "0.8.1"
linfa-clustering = "0.8.1"
linfa-linear = "0.8.1"
linfa-logistic = "0.8.1"
ndarray = "0.16"
rand_xoshiro = "0.6"
thiserror = "2.0.21"
# `hql = "0.7"` once hql publishes `hql::ext` (HQL-0057 part 1).

[package.metadata.hql]
package = "ml"
provides = ["ml", "ml.metrics"]
modules = "modules"
